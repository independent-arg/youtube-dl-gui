name: Build portable (Windows x64)

on:
  workflow_dispatch:

jobs:
  build-portable-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.94.1

      - name: Install frontend deps
        run: npm ci

      - name: Install cargo-about and tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,tauri-cli

      - name: Build Windows exe (release)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
        run: |
          cd src-tauri
          cargo tauri build
          cd ..

      - name: Bundle Portable Version (Windows only)
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $layoutRoot = "portable-layout"
          $portableFolder = "ovd-portable"

          $pkg = Get-Content -Raw "package.json" | ConvertFrom-Json
          $version = $pkg.version
          
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $zipName = "Open.Video.Downloader_$($version)_$($arch)-portable.zip"
          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Where-Object { $_.Name -notmatch "setup" } | Select-Object -First 1
          if (-not $exe) { Write-Error "Could not find main exe in $releaseDir" }

          New-Item -ItemType Directory -Path "$layoutRoot/$portableFolder" -Force | Out-Null
          New-Item -ItemType File -Path "$layoutRoot/$portableFolder/.keep" -Value "Do not remove this file or directory." -Force | Out-Null
          Copy-Item $exe.FullName -Destination "$layoutRoot/$exe.Name" -Force
          
          Compress-Archive -Path "$layoutRoot/*" -DestinationPath $zipName -Force

          Write-Output "PORTABLE_ASSET=$zipName"
      
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovd-portable
          path: Open.Video.Downloader_*_x64-portable.zip
